<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <linearGradient id="logoPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- PMH Stylized Monogram Group -->
  <g class="pmh-monogram" transform="translate(20, 20)" filter="url(#logoGlow)">
    <!-- Letter P (Horizontal Rounded Pills) -->
    <!-- Vertical stem: 12 horizontal bars -->
    <rect x="0" y="0" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="11" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="22" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="33" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="44" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="55" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="66" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="77" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="88" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="99" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="110" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="121" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="0" y="132" width="24" height="5" rx="2.5" fill="url(#logoPillGrad)" />

    <!-- P Loop Upper / Outer Caps -->
    <rect x="28" y="0" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="28" y="11" width="30" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="52" y="22" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="60" y="33" width="14" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="60" y="44" width="14" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="50" y="55" width="22" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    <rect x="28" y="66" width="26" height="5" rx="2.5" fill="url(#logoPillGrad)" />

    <!-- Letter M (Flowing Smooth Wave Ribbons) -->
    <g fill="none" stroke="url(#logoWaveGrad)" stroke-width="4.5" stroke-linecap="round">
      <path d="M 78 22 C 90 32, 98 72, 94 106 C 90 128, 112 134, 126 116 C 138 100, 142 66, 142 26" />
      <path d="M 86 26 C 98 36, 106 76, 102 110 C 98 132, 120 138, 134 120 C 146 104, 150 70, 150 26" />
      <path d="M 94 30 C 106 40, 114 80, 110 114 C 106 136, 128 142, 142 124 C 154 108, 158 74, 158 26" />
      <path d="M 102 34 C 114 44, 122 84, 118 118 C 114 140, 136 146, 150 128 C 162 112, 166 78, 166 26" />
    </g>

    <!-- Letter H (Horizontal Rounded Pills) -->
    <!-- Left Column of H -->
    <g transform="translate(170, 26)">
      <rect x="0" y="0" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="11" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="22" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="33" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="44" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="55" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="66" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="77" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="88" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="99" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="110" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    </g>

    <!-- H Center Connector -->
    <rect x="194" y="77" width="18" height="5" rx="2.5" fill="url(#logoPillGrad)" />

    <!-- Right Column of H -->
    <g transform="translate(216, 42)">
      <rect x="0" y="0" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="11" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="22" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="33" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="44" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="55" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="66" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="77" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="88" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
      <rect x="0" y="99" width="20" height="5" rx="2.5" fill="url(#logoPillGrad)" />
    </g>
  </g>

  <!-- Brand Typography: Pranesh Music Hub -->
  <g transform="translate(285, 25)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    <text x="0" y="44" font-size="44" letter-spacing="-0.5" fill="#f1f5f9">Pranesh</text>
    <text x="0" y="92" font-size="44" letter-spacing="-0.5" fill="#cbd5e1">Music</text>
    <text x="0" y="140" font-size="44" letter-spacing="-0.5" fill="#94a3b8">Hub</text>
  </g>
</svg>
