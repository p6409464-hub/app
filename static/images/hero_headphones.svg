<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="neonPurpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="30%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cupGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>

    <linearGradient id="cupGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>

    <linearGradient id="ringNeonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="ringNeonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f0728" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Ambient Glow Sphere -->
  <circle cx="270" cy="220" r="190" fill="url(#ambientOrb)" />

  <!-- Flowing Soundwave Audio Ribbons in Background -->
  <g fill="none" stroke-linecap="round">
    <path d="M 40 240 Q 120 180, 200 230 T 360 210 T 500 250" stroke="url(#waveGrad1)" stroke-width="3" filter="url(#softGlow)" />
    <path d="M 50 255 Q 130 195, 210 245 T 370 225 T 510 265" stroke="url(#waveGrad2)" stroke-width="2.5" />
    <path d="M 30 225 Q 110 165, 190 215 T 350 195 T 490 235" stroke="url(#waveGrad1)" stroke-width="2" opacity="0.6" />

    <!-- Vertical EQ Soundwave Bars behind headphones -->
    <g stroke="#a855f7" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
      <line x1="120" y1="210" x2="120" y2="250" />
      <line x1="130" y1="195" x2="130" y2="265" />
      <line x1="140" y1="180" x2="140" y2="280" />
      <line x1="150" y1="190" x2="150" y2="270" />
      <line x1="160" y1="205" x2="160" y2="255" />

      <line x1="380" y1="205" x2="380" y2="255" />
      <line x1="390" y1="190" x2="390" y2="270" />
      <line x1="400" y1="180" x2="400" y2="280" />
      <line x1="410" y1="195" x2="410" y2="265" />
      <line x1="420" y1="210" x2="420" y2="250" />
    </g>
  </g>

  <!-- 3D Headphones Graphic -->
  <g id="headphonesGroup" transform="translate(0, 10)">
    <!-- Headband Outer Arc -->
    <path d="M 170 230 C 170 120, 210 80, 270 80 C 330 80, 370 120, 370 230" 
          fill="none" stroke="#170f2f" stroke-width="36" stroke-linecap="round" />
    <path d="M 170 230 C 170 120, 210 80, 270 80 C 330 80, 370 120, 370 230" 
          fill="none" stroke="url(#headbandGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Headband Inner Cushion Pad -->
    <path d="M 195 210 C 200 135, 230 102, 270 102 C 310 102, 340 135, 345 210" 
          fill="none" stroke="#120c24" stroke-width="12" stroke-linecap="round" opacity="0.9" />

    <!-- Headband Top Highlight Edge -->
    <path d="M 215 130 C 235 98, 252 92, 270 92 C 288 92, 305 98, 325 130" 
          fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- Left Fork / Hinge -->
    <rect x="156" y="215" width="22" height="28" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="2" />
    <circle cx="167" cy="229" r="4" fill="#a5b4fc" />

    <!-- Right Fork / Hinge -->
    <rect x="362" y="215" width="22" height="28" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="2" />
    <circle cx="373" cy="229" r="4" fill="#a5b4fc" />

    <!-- Left Earcup (Angled 3D Isometric View) -->
    <g transform="translate(160, 280) rotate(-12)">
      <!-- Outer Ear Cushion (Dark Velvet) -->
      <ellipse cx="0" cy="0" rx="46" ry="64" fill="url(#cupGradLeft)" stroke="#312e81" stroke-width="3" />
      <!-- Glowing Inner Neon Ring -->
      <ellipse cx="0" cy="0" rx="36" ry="52" fill="none" stroke="url(#ringNeonLeft)" stroke-width="4.5" filter="url(#neonPurpleGlow)" />
      <!-- Inner Speaker Grill Mesh -->
      <ellipse cx="0" cy="0" rx="26" ry="40" fill="#0d071d" stroke="#4c1d95" stroke-width="2" />
      <circle cx="0" cy="0" r="12" fill="#1e103a" stroke="#8b5cf6" stroke-width="1.5" />
    </g>

    <!-- Right Earcup (Angled 3D Isometric View) -->
    <g transform="translate(380, 280) rotate(12)">
      <!-- Outer Ear Cushion (Dark Velvet) -->
      <ellipse cx="0" cy="0" rx="46" ry="64" fill="url(#cupGradRight)" stroke="#312e81" stroke-width="3" />
      <!-- Glowing Inner Neon Ring -->
      <ellipse cx="0" cy="0" rx="36" ry="52" fill="none" stroke="url(#ringNeonRight)" stroke-width="4.5" filter="url(#neonPurpleGlow)" />
      <!-- Inner Speaker Grill Mesh -->
      <ellipse cx="0" cy="0" rx="26" ry="40" fill="#0d071d" stroke="#4c1d95" stroke-width="2" />
      <circle cx="0" cy="0" r="12" fill="#1e103a" stroke="#8b5cf6" stroke-width="1.5" />
    </g>
  </g>

  <!-- Ambient Light Sparkles -->
  <circle cx="110" cy="160" r="2.5" fill="#c084fc" filter="url(#softGlow)" />
  <circle cx="430" cy="150" r="3" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="270" cy="65" r="2" fill="#e0e7ff" filter="url(#softGlow)" />
  <circle cx="450" cy="280" r="2" fill="#a855f7" filter="url(#softGlow)" />
  <circle cx="90" cy="290" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
</svg>
