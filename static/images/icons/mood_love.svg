<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
      <linearGradient id="mLove" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#500724"/>
        <stop offset="100%" stop-color="#18040f"/>
      </linearGradient>
      <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <rect width="100" height="100" rx="16" fill="url(#mLove)" />
    <!-- Glowing Neon Heart -->
    <path d="M 50 74 C 20 54, 18 32, 34 24 C 42 20, 48 26, 50 30 C 52 26, 58 20, 66 24 C 82 32, 80 54, 50 74 Z" 
          fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#heartGlow)" />
    <path d="M 50 64 C 28 48, 26 32, 37 27 C 43 24, 48 28, 50 32 C 52 28, 57 24, 63 27 C 74 32, 72 48, 50 64 Z" 
          fill="rgba(244, 63, 94, 0.25)" stroke="#fb7185" stroke-width="2" />
  </svg>