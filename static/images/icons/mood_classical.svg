<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
      <linearGradient id="mClass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#713f12"/>
        <stop offset="100%" stop-color="#1c1917"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="16" fill="url(#mClass)" />
    <!-- Indian Classical Veena -->
    <g transform="translate(50, 50) rotate(-40)">
      <!-- Main Resonator Bowl (Kudam) -->
      <circle cx="-16" cy="18" r="15" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
      <!-- Dandi / Neck -->
      <rect x="-14" y="-32" width="6" height="50" rx="2" fill="#b45309" stroke="#fbbf24" stroke-width="1.5" />
      <!-- Upper Resonator (Yali head) -->
      <circle cx="-11" cy="-32" r="7" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
      <!-- Strings -->
      <line x1="-12.5" y1="-32" x2="-14" y2="18" stroke="#fef3c7" stroke-width="1" />
      <line x1="-9.5" y1="-32" x2="-11" y2="18" stroke="#fef3c7" stroke-width="1" />
    </g>
  </svg>